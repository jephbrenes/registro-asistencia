<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Asistencia</title>

    <link rel="stylesheet" href="estilos.css">

    <!-- Librería para generar archivos Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>

<body>

<header class="encabezado">
    <div>
        <h1>Registro de Asistencia</h1>
        <p>Control semanal de empleados</p>
    </div>

    <button id="btnAgregarEmpleado" class="btn-principal">
        + Agregar empleado
    </button>
    <button
                    id="btnDescargarExcel"
                    class="btn-excel"
                    type="button"
                >
                    📊 Descargar Excel
                </button>
</header>


<div class="contenedor">

    <!-- =========================
         PANEL DE EMPLEADOS
    ========================== -->
    <aside class="panel-empleados">

        <div class="titulo-panel">
            <div>
                <h2>Empleados</h2>
                <span id="cantidadEmpleados">0 empleados</span>
            </div>
        </div>

        <div class="buscador">
            <input
                type="text"
                id="buscarEmpleado"
                placeholder="Buscar empleado..."
            >
        </div>

        <div id="listaEmpleados" class="lista-empleados"></div>

    </aside>


    <!-- =========================
         CONTENIDO PRINCIPAL
    ========================== -->
    <main class="contenido">

        <div id="estadoVacio" class="estado-vacio">

            <div class="icono-vacio">👤</div>

            <h2>Selecciona un empleado</h2>

            <p>
                Selecciona un empleado de la lista para consultar
                y modificar su asistencia.
            </p>

        </div>


        <section id="panelAsistencia" class="panel-asistencia oculto">

            <!-- ENCABEZADO DEL EMPLEADO -->
            <div class="encabezado-empleado">

                <div>
                    <h2 id="nombreEmpleadoSeleccionado"></h2>
                    <p id="identificacionEmpleadoSeleccionado"></p>
                </div>

                <div class="acciones-empleado">

                    <button
                        id="btnEditarEmpleado"
                        class="btn-secundario"
                    >
                        ✏️ Editar
                    </button>

                    <button
                        id="btnEliminarEmpleado"
                        class="btn-peligro"
                    >
                        🗑️ Eliminar
                    </button>

                </div>

            </div>


            <!-- =========================
                 NAVEGACIÓN SEMANAL
            ========================== -->
            <div class="navegacion-semana">

                <button id="btnSemanaAnterior" class="btn-navegacion">
                    ←
                </button>

                <button id="btnEstaSemana" class="btn-semana">
                    Esta semana
                </button>

                <button id="btnSemanaSiguiente" class="btn-navegacion">
                    →
                </button>

            </div>


            <!-- =========================
                 INFORMACIÓN DE LA SEMANA
            ========================== -->
            <div class="resumen-semana">

                <div class="numero-semana">
                    <span>Semana</span>
                    <strong id="numeroSemana">--</strong>
                </div>

                <div class="balance-semanal">

                    <span>Balance semanal</span>

                    <strong id="balanceSemanal">
                        0 minutos
                    </strong>

                </div>

                <div class="rango-semana">
                    <span id="rangoSemana"></span>
                </div>

                <!-- BOTÓN ÚNICO DE EXCEL -->
                <!-- <button
                    id="btnDescargarExcel"
                    class="btn-excel"
                    type="button"
                >
                    📊 Descargar Excel
                </button> -->

            </div>


            <!-- =========================
                 DÍAS DE LA SEMANA
            ========================== -->
            <div id="diasSemana" class="dias-semana"></div>


            <!-- =========================
                 EDITOR
            ========================== -->
            <div
                id="editorAsistencia"
                class="editor-asistencia oculto"
            >

                <div class="editor-titulo">

                    <div>
                        <h3 id="tituloEditor"></h3>
                        <p id="horarioBaseEditor"></p>
                    </div>

                    <button
                        id="btnCerrarEditor"
                        class="btn-cerrar"
                    >
                        ×
                    </button>

                </div>


                <div class="formulario-asistencia">

                    <div class="campo">
                        <label for="horaEntrada">
                            Hora de entrada
                        </label>

                        <input
                            type="time"
                            id="horaEntrada"
                        >
                    </div>


                    <div class="campo">
                        <label for="horaSalida">
                            Hora de salida
                        </label>

                        <input
                            type="time"
                            id="horaSalida"
                        >
                    </div>


                    <div class="campo">
                        <label for="estadoAsistencia">
                            Estado
                        </label>

                        <select id="estadoAsistencia">

                            <option value="Completo">
                                Completo
                            </option>

                            <option value="Tarde">
                                Tarde
                            </option>

                            <option value="Hora extra">
                                Hora extra
                            </option>

                            <option value="Salida antes">
                                Salida antes
                            </option>

                            <option value="Ausente">
                                Ausente
                            </option>

                            <option value="Justificado">
                                Justificado
                            </option>

                        </select>
                    </div>


                    <div class="campo campo-completo">

                        <label for="observacion">
                            Observación
                        </label>

                        <textarea
                            id="observacion"
                            rows="3"
                            placeholder="Observación opcional..."
                        ></textarea>

                    </div>

                </div>


                <div class="acciones-editor">

                    <button
                        id="btnRestaurarHorario"
                        class="btn-secundario"
                    >
                        Restaurar horario
                    </button>

                    <button
                        id="btnGuardarAsistencia"
                        class="btn-principal"
                    >
                        Guardar asistencia
                    </button>

                </div>

            </div>

        </section>

    </main>

</div>


<!-- =========================
     MODAL EMPLEADO
========================== -->
<div id="modalEmpleado" class="modal oculto">

    <div class="modal-contenido">

        <div class="modal-encabezado">

            <h2 id="tituloModalEmpleado">
                Agregar empleado
            </h2>

            <button
                id="btnCerrarModalEmpleado"
                class="btn-cerrar"
            >
                ×
            </button>

        </div>


        <div class="formulario-empleado">

            <div class="campo">

                <label for="nombreEmpleado">
                    Nombre completo
                </label>

                <input
                    type="text"
                    id="nombreEmpleado"
                    placeholder="Ej. Jepherson Brenes"
                >

            </div>


            <div class="campo">

                <label for="identificacionEmpleado">
                    Identificación
                </label>

                <input
                    type="text"
                    id="identificacionEmpleado"
                    placeholder="Número de identificación"
                >

            </div>

        </div>


        <div class="acciones-modal">

            <button
                id="btnCancelarEmpleado"
                class="btn-secundario"
            >
                Cancelar
            </button>

            <button
                id="btnGuardarEmpleado"
                class="btn-principal"
            >
                Guardar empleado
            </button>

        </div>

    </div>

</div>


<!-- NOTIFICACIONES -->
<div id="notificacion" class="notificacion"></div>


<script src="script.js"></script>

</body>
</html>
