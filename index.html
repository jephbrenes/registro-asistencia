<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Asistencia</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

<div class="app">

    <!-- =========================================
         ENCABEZADO
    ========================================== -->

    <header class="header">

        <div>
            <h1>Registro de Asistencia</h1>
            <p>Control semanal de empleados</p>
        </div>

        <button
            id="btnAgregarEmpleado"
            class="btn-principal"
            type="button"
        >
            + Agregar empleado
        </button>

    </header>


    <!-- =========================================
         CONTENIDO
    ========================================== -->

    <main class="contenido">


        <!-- =====================================
             PANEL DE EMPLEADOS
        ====================================== -->

        <aside class="panel empleados-panel">

            <div class="panel-titulo">

                <h2>Empleados</h2>

                <span id="cantidadEmpleados">
                    0
                </span>

            </div>


            <input
                type="text"
                id="buscarEmpleado"
                class="input-buscar"
                placeholder="Buscar empleado..."
                autocomplete="off"
            >


            <div
                id="listaEmpleados"
                class="lista-empleados"
            >
                <!-- JavaScript -->
            </div>

        </aside>



        <!-- =====================================
             PANEL DE ASISTENCIA
        ====================================== -->

        <section class="panel asistencia-panel">


            <!-- SIN EMPLEADO SELECCIONADO -->

            <div
                id="sinEmpleadoSeleccionado"
                class="sin-empleado"
            >

                <div class="icono-grande">
                    👤
                </div>

                <h2>
                    Selecciona un empleado
                </h2>

                <p>
                    Selecciona un empleado de la lista
                    para consultar y modificar su asistencia.
                </p>

            </div>



            <!-- EMPLEADO SELECCIONADO -->

            <div
                id="contenidoEmpleado"
                class="oculto"
            >


                <!-- =================================
                     CABECERA DEL EMPLEADO
                ================================== -->

                <div class="empleado-header">

                    <div>

                        <span class="texto-pequeno">
                            Empleado
                        </span>

                        <h2 id="nombreEmpleadoSeleccionado">
                            -
                        </h2>

                    </div>


                    <!-- NAVEGACIÓN SEMANAL -->

                    <div class="navegacion-semana">

                        <button
                            id="btnSemanaAnterior"
                            class="btn-navegacion"
                            type="button"
                            title="Semana anterior"
                        >
                            ‹
                        </button>


                        <button
                            id="btnSemanaActual"
                            class="btn-hoy"
                            type="button"
                        >
                            Esta semana
                        </button>


                        <button
                            id="btnSemanaSiguiente"
                            class="btn-navegacion"
                            type="button"
                            title="Semana siguiente"
                        >
                            ›
                        </button>

                    </div>

                </div>



                <!-- =================================
                     BALANCE SEMANAL
                ================================== -->

                <div class="balance-semanal">

                    <div class="numero-semana">

                        <span>
                            Semana
                        </span>

                        <strong id="numeroSemana">
                            -
                        </strong>

                    </div>


                    <div class="balance">

                        <span>
                            Balance semanal
                        </span>

                        <strong id="balanceSemanal">
                            0h 00m
                        </strong>

                    </div>

                </div>



                <!-- =================================
                     RANGO DE FECHAS
                ================================== -->

                <div class="rango-semana">

                    <span id="rangoSemana">
                        -
                    </span>

                </div>



                <!-- =================================
                     DÍAS
                ================================== -->

                <div
                    id="diasSemana"
                    class="dias-semana"
                >
                    <!-- JavaScript -->
                </div>



                <!-- =================================
                     EDITOR DE ASISTENCIA
                ================================== -->

                <div
                    id="editorAsistencia"
                    class="editor oculto"
                >

                    <div class="editor-header">

                        <div>

                            <span class="texto-pequeno">
                                Modificando
                            </span>

                            <h3 id="fechaEditor">
                                -
                            </h3>

                        </div>


                        <button
                            id="btnCerrarEditor"
                            class="btn-cerrar"
                            type="button"
                        >
                            ×
                        </button>

                    </div>



                    <div class="form-grid">


                        <!-- ENTRADA -->

                        <div class="campo">

                            <label for="entrada">
                                Hora de entrada
                            </label>

                            <input
                                type="time"
                                id="entrada"
                            >

                        </div>


                        <!-- SALIDA -->

                        <div class="campo">

                            <label for="salida">
                                Hora de salida
                            </label>

                            <input
                                type="time"
                                id="salida"
                            >

                        </div>


                        <!-- ESTADO -->

                        <div class="campo campo-completo">

                            <label for="estado">
                                Estado
                            </label>

                            <select id="estado">

                                <option value="Completo">
                                    Completo
                                </option>

                                <option value="Tarde">
                                    Tarde
                                </option>

                                <option value="Hora extra">
                                    Hora extra
                                </option>

                                <option value="Salida antes">
                                    Salida antes
                                </option>

                                <option value="Ausente">
                                    Ausente
                                </option>

                                <option value="Justificado">
                                    Justificado
                                </option>

                            </select>

                        </div>


                        <!-- OBSERVACIÓN -->

                        <div class="campo campo-completo">

                            <label for="observacion">
                                Observación
                            </label>

                            <textarea
                                id="observacion"
                                rows="3"
                                placeholder="Escriba una observación..."
                            ></textarea>

                        </div>

                    </div>



                    <div class="editor-botones">

                        <button
                            id="btnRestaurar"
                            class="btn-secundario"
                            type="button"
                        >
                            Restaurar horario
                        </button>


                        <button
                            id="btnGuardar"
                            class="btn-principal"
                            type="button"
                        >
                            Guardar cambios
                        </button>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>



<!-- =========================================
     MODAL AGREGAR / EDITAR EMPLEADO
========================================== -->

<div
    id="modalEmpleado"
    class="modal oculto"
>

    <div class="modal-contenido">


        <div class="modal-header">

            <div>

                <span class="texto-pequeno">
                    Registro de empleado
                </span>

                <h2 id="tituloModalEmpleado">
                    Agregar empleado
                </h2>

            </div>


            <button
                id="btnCerrarModal"
                class="btn-cerrar"
                type="button"
            >
                ×
            </button>

        </div>



        <!-- NOMBRE -->

        <div class="campo">

            <label for="nombreEmpleado">
                Nombre completo
            </label>

            <input
                type="text"
                id="nombreEmpleado"
                placeholder="Ej. Juan Pérez"
                autocomplete="off"
            >

        </div>



        <!-- IDENTIFICACIÓN -->

        <div class="campo">

            <label for="identificacionEmpleado">
                Identificación
            </label>

            <input
                type="text"
                id="identificacionEmpleado"
                placeholder="Opcional"
                autocomplete="off"
            >

        </div>



        <div class="modal-botones">

            <button
                id="btnCancelarEmpleado"
                class="btn-secundario"
                type="button"
            >
                Cancelar
            </button>


            <button
                id="btnGuardarEmpleado"
                class="btn-principal"
                type="button"
            >
                Guardar empleado
            </button>

        </div>

    </div>

</div>



<!-- =========================================
     NOTIFICACIÓN
========================================== -->

<div
    id="notificacion"
    class="notificacion"
>

    <span id="textoNotificacion"></span>

</div>



<script src="script.js"></script>

</body>
</html>
